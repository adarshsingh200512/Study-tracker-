name: Build Study Tracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: none

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          set -e

          cd "$RUNNER_TEMP"

          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip

          unzip -q gradle-8.11.1-bin.zip

          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Find Study Tracker ZIP
        shell: bash
        run: |
          set -e

          echo "Searching repository for Study Tracker ZIP..."

          ZIP_FILE=""

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -iname 'Study-Tracker-FINAL-GITHUB.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -iname '*.zip' \
              -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Study Tracker ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/study-tracker"
          mkdir -p "$RUNNER_TEMP/study-tracker"

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/study-tracker"

          echo "Extraction completed."

          echo "Extracted files:"
          find "$RUNNER_TEMP/study-tracker" \
            -maxdepth 5 \
            -type f \
            | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          SETTINGS_FILE="$(
            find "$RUNNER_TEMP/study-tracker" \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
              \) \
              -print \
              -quit
          )"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."

            echo "Extracted directory:"
            find "$RUNNER_TEMP/study-tracker" \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then

            echo "ERROR: Android app module was not found."

            echo "Project contents:"
            find "$PROJECT_DIR" \
              -maxdepth 5 \
              -type f \
              | sort

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "================================="
          echo "ANDROID PROJECT"
          echo "================================="

          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "settings.gradle:"
          ls -lh "$PROJECT_DIR/settings.gradle" 2>/dev/null || true

          echo ""
          echo "App module:"
          ls -lh "$PROJECT_DIR/app"

          echo ""
          echo "Java source:"
          find "$PROJECT_DIR/app/src/main" \
            -type f \
            | sort

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building Study Tracker APK..."

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_FILE="$(
            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              -print \
              -quit
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "Build directory:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 8 \
              -type f \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          echo "================================="
          echo "APK BUILD SUCCESSFUL"
          echo "================================="

          echo "APK:"
          echo "$APK_FILE"

          ls -lh "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/Study-Tracker-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Tracker-APK
          path: apk-output/Study-Tracker-debug.apk
          if-no-files-found: error
