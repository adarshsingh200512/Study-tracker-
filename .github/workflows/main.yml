name: Build Study Tracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Searching for Android project..."

          PROJECT_DIR=""

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            FOUND=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "Repository contents:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "gradlew not found. Creating Gradle wrapper..."
            gradle wrapper --gradle-version 8.11.1
            chmod +x ./gradlew
            ./gradlew assembleDebug
          fi

      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Tracker-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
