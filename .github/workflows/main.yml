name: Build Study Tracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | sort

      - name: Check Android project
        shell: bash
        run: |
          if [ ! -f "extracted/settings.gradle" ] && [ ! -f "extracted/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "extracted/app/build.gradle" ] && [ ! -f "extracted/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle/app/build.gradle.kts not found."
            exit 1
          fi

          echo "Android project detected successfully."

      - name: Build Debug APK
        working-directory: extracted
        shell: bash
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          APK=$(find extracted/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" StudyTracker-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-debug-APK
          path: StudyTracker-debug.apk
          if-no-files-found: error
