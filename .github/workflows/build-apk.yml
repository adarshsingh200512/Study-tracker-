name: Build Study Tracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: build-apk
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Setup Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 6. Find Android project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          # Find ZIP file if repository contains one
          ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./.git/*" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"

            rm -rf extracted-project
            mkdir -p extracted-project

            unzip -q -o "$ZIP_FILE" -d extracted-project

            SEARCH_ROOT="extracted-project"
          else
            echo "No ZIP found. Using repository directly."
            SEARCH_ROOT="."
          fi

          # Find settings.gradle or settings.gradle.kts
          SETTINGS_FILE=$(find "$SEARCH_ROOT" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/.gradle/*" \
            | head -n 1 || true)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            echo "Repository contents:"
            find "$SEARCH_ROOT" -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. Check Android project
      - name: Validate Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle/build.gradle.kts not found."
            exit 1
          fi

          echo ""
          echo "Android project validation successful."

      # 8. Build APK with Gradle 8.9
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Using Gradle:"
          gradle --version

          echo ""
          echo "Building Debug APK..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # 9. Find generated APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK_COUNT=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -not -path "*/.gradle/*" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK files found:"
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -not -path "*/.gradle/*" \
            -print

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
