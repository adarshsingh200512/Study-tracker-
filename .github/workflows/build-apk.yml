name: Build Study Tracker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip" -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.11.1/bin/gradle" --version

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Android project is already at repository root."
            exit 0
          fi

          ZIP_FILE="$(find . -maxdepth 3 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project or ZIP file found."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          rm -rf "$RUNNER_TEMP/study-project"
          mkdir -p "$RUNNER_TEMP/study-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/study-project"

          SETTINGS="$(find "$RUNNER_TEMP/study-project" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Extracted Android project: $PROJECT_DIR"

      - name: Select project directory
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            echo "Using repository root as Android project."
          fi

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "Study Tracker Android project verified."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK created: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Tracker-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
