name: Build Study Tracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Extract ZIP
        shell: bash
        run: |
          echo "ZIP files found:"
          find . -type f -name "*.zip" -print

          for zipfile in $(find . -type f -name "*.zip"); do
            echo "Extracting: $zipfile"
            unzip -o "$zipfile" -d extracted
          done

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -200

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""

          FOUND=$(find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -not -path "./.git/*" -print -quit)

          if [ -n "$FOUND" ]; then
            PROJECT_DIR=$(dirname "$FOUND")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "Searching repository:"
            find . -maxdepth 6 -type f | head -300
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew not found."

            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper --gradle-version 8.11.1
            else
              echo "Installing Gradle..."
              sudo apt-get update
              sudo apt-get install -y gradle
              gradle wrapper --gradle-version 8.11.1
            fi

            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Tracker-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
