name: Build Study Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "Checking repository..."

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$PWD"
            echo "Project found in root."
          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project/ZIP not found."
              exit 1
            fi

            echo "ZIP found: $ZIP_FILE"

            mkdir -p extracted-project
            unzip -o "$ZIP_FILE" -d extracted-project

            PROJECT_DIR=$(find extracted-project -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print -quit | xargs -r dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: settings.gradle not found."
              exit 1
            fi

            PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Gradle project..."

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          echo "Android project check passed."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting APK build..."

          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
