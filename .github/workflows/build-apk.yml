name: Build Study Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # --------------------------------------------------
      # FIND ZIP OR EXISTING ANDROID PROJECT
      # --------------------------------------------------
      - name: Prepare Android Project
        shell: bash
        run: |
          set -e

          echo "===== Repository ====="
          find . -maxdepth 3 -type f | sort | head -300

          # If Android project is already at root, use it
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            if [ -d "app" ]; then
              echo "Android project found at repository root."
              echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          # Find ZIP file
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -type f -iname "*.zip" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP found."
            echo "Searching for settings.gradle files:"
            find "$GITHUB_WORKSPACE" -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted-project"
          mkdir -p "$GITHUB_WORKSPACE/extracted-project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted-project"

          echo "===== Extracted Files ====="
          find "$GITHUB_WORKSPACE/extracted-project" -maxdepth 5 -type f | sort | head -500

          # Locate the actual Android project
          PROJECT_DIR=""

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE=$(dirname "$SETTINGS_FILE")

            if [ -d "$CANDIDATE/app" ]; then
              PROJECT_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted-project" -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be located."
            echo "Found settings files:"
            find "$GITHUB_WORKSPACE/extracted-project" -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
            exit 1
          fi

          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # VALIDATE PROJECT
      # --------------------------------------------------
      - name: Check Android Project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "===== Project Files ====="
          ls -la "$PROJECT_DIR"

          echo "===== App Folder ====="
          ls -la "$PROJECT_DIR/app"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo "Android project structure is valid."

      # --------------------------------------------------
      # GRADLE
      # --------------------------------------------------
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # --------------------------------------------------
      # BUILD APK
      # --------------------------------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "===== Gradle Version ====="
          gradle --version

          echo "===== Building APK ====="
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # --------------------------------------------------
      # FIND APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."

            echo "===== Build Outputs ====="
            find "$PROJECT_DIR" \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # UPLOAD APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Tracker-Debug-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
