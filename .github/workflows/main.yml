name: Build Study Tracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file nahi mila."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project nahi mila."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Tracker-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
